version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    env_file:
      - ./app/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/queries.sql:/docker-entrypoint-initdb.d/queries.sql
      - ./app/db/verify-init.sql:/docker-entrypoint-initdb.d/02-verify-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app/.env
    ports:
      - "8000:8000"
    networks:
      - app_network
    volumes:
      - ./app:/app/app

  # Rest of your services remain the same...

  streamlit:
    build:
      context: .
      dockerfile: streamlit.Dockerfile
    container_name: streamlit
    depends_on:
      - backend
    env_file:
      - ./streamlitapp/.env
    ports:
      - "8501:8501"
    networks:
      - app_network
    volumes:
      - ./streamlitapp:/app

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
